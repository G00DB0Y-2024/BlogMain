<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A quiet index of Typora notes.">
  <title>Typora Notes</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body class="home-page">
  <div class="shell">
    <header class="hero" aria-label="站点封面">
      <div class="hero-inner">
        <div class="hero-card">
          <div class="hero-avatar" aria-hidden="true" style="background-image: url('./assets/avatar.jpg')"></div>
          <h1 class="hero-title">Typora Notes</h1>
          <p class="hero-subtitle">文件夹即分类，Markdown 即文章。这里是一个安静的技术笔记目录。</p>
        </div>
      </div>
    </header>

    <main class="main-grid" aria-label="博客首页">
      <aside class="panel panel-pad profile-card" aria-label="站点信息">
        <div class="profile-cover" aria-hidden="true"></div>
        <section class="profile-meta">
          <h2>About</h2>
          <p>这里直接展示 Typora 目录结构。点击任意 Markdown 文件，会在新的标签页中打开并按 Typora 风格渲染。</p>
        </section>
        <section class="stats" aria-label="统计信息">
          <div class="stat">
            <span class="stat-value" id="total-posts">—</span>
            <span class="stat-label">notes</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="total-categories">—</span>
            <span class="stat-label">categories</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="latest-updated">—</span>
            <span class="stat-label">updated</span>
          </div>
        </section>
      </aside>

      <section class="panel panel-pad tree-card" aria-label="文件树">
        <div class="tree-header">
          <div>
            <h2 class="section-title">Entries</h2>
            <p class="section-desc" id="generated-at">Loading directory index…</p>
          </div>
          <div class="tree-toolbar" aria-label="文件树工具">
            <span id="root-name">BlogMain</span>
          </div>
        </div>
        <div class="tree-wrap">
          <div id="tree" class="tree" role="tree" aria-label="Markdown 文件树">
            <div class="tree-empty">正在读取 manifest.json</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { escapeHtml, formatDate, formatTimestamp } from './scripts/shared.js';

    const treeEl = document.querySelector('#tree');
    const totalPostsEl = document.querySelector('#total-posts');
    const totalCategoriesEl = document.querySelector('#total-categories');
    const latestUpdatedEl = document.querySelector('#latest-updated');
    const generatedAtEl = document.querySelector('#generated-at');
    const rootNameEl = document.querySelector('#root-name');

    function metaText(node) {
      if (node.type === 'directory') {
        return `${node.count || 0} notes`;
      }
      return formatDate(node.mtime);
    }

    function buildViewerUrl(markdownPath) {
      const url = new URL('./viewer.html', window.location.href);
      url.searchParams.set('file', `notes/${String(markdownPath).replace(/^\/+/, '')}`);
      return url.toString();
    }

    function renderLine({ node, prefix, connector }) {
      const isDirectory = node.type === 'directory';
      const label = isDirectory ? node.name : (node.title || node.name.replace(/\.md$/i, ''));
      const meta = metaText(node);
      const title = escapeHtml(label);
      const className = isDirectory ? 'is-directory' : 'is-file';
      const content = isDirectory
        ? `<span class="tree-node-title">${title}</span>`
        : `<a class="tree-node-title" href="${buildViewerUrl(node.path)}" target="_blank" rel="noopener noreferrer">${title}</a>`;

      return `
        <div class="tree-line" role="treeitem" aria-label="${title}">
          <span class="tree-indent" aria-hidden="true">${escapeHtml(prefix)}</span>
          <span class="tree-symbol" aria-hidden="true">${connector}</span>
          <span class="tree-node ${className}">
            ${content}
            <span class="tree-node-meta">${escapeHtml(meta)}</span>
          </span>
        </div>`;
    }

    function renderNodes(nodes, prefix = '') {
      return nodes.map((node, index) => {
        const isLast = index === nodes.length - 1;
        const connector = isLast ? '└─' : '├─';
        const nextPrefix = prefix + (isLast ? '   ' : '│  ');
        const current = renderLine({ node, prefix, connector });
        const children = node.type === 'directory' && Array.isArray(node.children)
          ? renderNodes(node.children, nextPrefix)
          : '';
        return current + children;
      }).join('');
    }

    async function init() {
      try {
        const response = await fetch('./manifest.json', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error(`manifest.json 请求失败：${response.status}`);
        }
        const manifest = await response.json();
        document.title = manifest.rootName ? `${manifest.rootName} · Typora Notes` : 'Typora Notes';
        totalPostsEl.textContent = manifest.totalPosts ?? 0;
        totalCategoriesEl.textContent = manifest.totalCategories ?? 0;
        latestUpdatedEl.textContent = manifest.latestUpdatedAt || '—';
        rootNameEl.textContent = manifest.rootName || 'BlogMain';
        generatedAtEl.textContent = manifest.generatedAt
          ? `Index generated at ${formatTimestamp(manifest.generatedAt)}`
          : 'Static directory index';

        const rootLine = `
          <div class="tree-line" role="treeitem" aria-label="${escapeHtml(manifest.rootName || 'BlogMain')}">
            <span class="tree-indent" aria-hidden="true"></span>
            <span class="tree-symbol" aria-hidden="true">.</span>
            <span class="tree-node is-directory">
              <span class="tree-node-title">${escapeHtml(manifest.rootName || 'BlogMain')}</span>
              <span class="tree-node-meta">${manifest.totalPosts ?? 0} notes</span>
            </span>
          </div>`;
        treeEl.innerHTML = rootLine + renderNodes(Array.isArray(manifest.tree) ? manifest.tree : []);
      } catch (error) {
        treeEl.innerHTML = `<div class="tree-empty">无法读取目录索引：${escapeHtml(error.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
