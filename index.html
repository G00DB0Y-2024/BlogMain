<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A quiet index of Typora notes.">
  <title>Crystal-Blogs</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body class="home-page">
  <header class="hero" aria-label="站点封面">
    <div class="hero-inner">
      <div class="hero-card">
        <div class="hero-avatar" aria-hidden="true" style="background-image: url('./assets/avatar.jpg')"></div>
        <h1 class="hero-title">Crystal's Blog</h1>
        <p class="hero-subtitle">The two sides of the equal sign represent different definitions of the same thing.</p>
      </div>
    </div>
  </header>

  <div class="shell">
    <main class="main-grid" aria-label="博客首页">
      <aside class="panel panel-pad profile-card" aria-label="站点信息">
        <div class="profile-cover" aria-hidden="true"></div>
        <section class="profile-meta">
          <h2>About</h2>
          <p>这里是我的Typora的"在线版", 我会更新自己的文章. 暂先用Github托管吧, 以后会有服务器的!</p>
        </section>
        <section class="stats" aria-label="统计信息">
          <div class="stat">
            <span class="stat-value" id="total-posts">—</span>
            <span class="stat-label">notes</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="total-categories">—</span>
            <span class="stat-label">categories</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="latest-updated">—</span>
            <span class="stat-label">updated</span>
          </div>
        </section>
      </aside>

      <section class="panel panel-pad tree-card" aria-label="文件树">
        <div class="tree-header">
          <div>
            <h2 class="section-title">Entries</h2>
            <p class="section-desc" id="generated-at">Loading directory index…</p>
          </div>
        </div>
        <div class="tree-wrap">
          <div id="tree" class="tree" role="tree" aria-label="Markdown 文件树">
            <div class="tree-empty">正在读取 manifest.json</div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module">
    import { escapeHtml, formatDate, formatTimestamp } from './scripts/shared.js';

    const treeEl = document.querySelector('#tree');
    const totalPostsEl = document.querySelector('#total-posts');
    const totalCategoriesEl = document.querySelector('#total-categories');
    const latestUpdatedEl = document.querySelector('#latest-updated');
    const generatedAtEl = document.querySelector('#generated-at');

    function metaText(node) {
      if (node.type === 'directory') {
        return `${node.count || 0} notes`;
      }
      return formatDate(node.mtime);
    }

    function buildViewerUrl(markdownPath) {
      const url = new URL('./viewer.html', window.location.href);
      url.searchParams.set('file', `notes/${String(markdownPath).replace(/^\/+/, '')}`);
      return url.toString();
    }

    function renderDirectory(node, depth = 0) {
      const title = escapeHtml(node.name);
      const meta = escapeHtml(metaText(node));
      const children = Array.isArray(node.children) ? node.children : [];
      const openAttr = depth <= 0 ? ' open' : '';
      return `<li><details${openAttr}><summary><div class="tree-item directory-item" role="treeitem" aria-label="${title}"><span class="tree-marker" aria-hidden="true">▶</span><span class="tree-label">${title}</span><span class="tree-meta">${meta}</span></div></summary>${renderNodes(children, depth + 1)}</details></li>`;
    }

    function renderFile(node) {
      const label = node.title || node.name.replace(/\.md$/i, '');
      const title = escapeHtml(label);
      const meta = escapeHtml(metaText(node));
      return `<li><a class="tree-item file-item" role="treeitem" aria-label="${title}" href="${buildViewerUrl(node.path)}" target="_blank" rel="noopener noreferrer"><span class="tree-marker" aria-hidden="true">●</span><span class="tree-label">${title}</span><span class="tree-meta">${meta}</span></a></li>`;
    }

    function renderNodes(nodes, depth = 0) {
      const items = nodes.map((node) => {
        if (node.type === 'directory') {
          return renderDirectory(node, depth);
        }
        return renderFile(node);
      }).join('');

      return `<ul class="file-tree${depth === 0 ? ' root-tree' : ''}" role="${depth === 0 ? 'tree' : 'group'}">${items}</ul>`;
    }

    const MOBILE_BREAKPOINT = 640;

    function syncRootLineWidthMobile() {
      if (window.innerWidth > MOBILE_BREAKPOINT) return;
      const rootLine = document.querySelector('.tree-root-line');
      const treeWrap = document.querySelector('.tree-wrap');
      if (!rootLine || !treeWrap) return;
      const w = treeWrap.scrollWidth;
      rootLine.style.width = `${w}px`;
      rootLine.style.minWidth = `${w}px`;
    }

    function getDirectoryChildren(details) {
      return details.querySelector(':scope > ul.file-tree');
    }

    function stopTreeTransition(children) {
      if (children._treeTransitionCleanup) {
        children._treeTransitionCleanup();
      }
    }

    function animateDirectory(details, shouldOpen) {
      const children = getDirectoryChildren(details);
      const targetOpen = details.dataset.treeTargetOpen === undefined
        ? details.open
        : details.dataset.treeTargetOpen === 'true';
      if (!children || targetOpen === shouldOpen) return;

      stopTreeTransition(children);
      details.dataset.treeTargetOpen = String(shouldOpen);
      children.classList.add('is-tree-transitioning');
      children.style.overflow = 'hidden';

      if (shouldOpen) {
        details.open = true;
        children.style.height = `${children.getBoundingClientRect().height}px`;
        children.style.opacity = '0';
        requestAnimationFrame(() => {
          children.style.height = `${children.scrollHeight}px`;
          children.style.opacity = '1';
        });
      } else {
        children.style.height = `${children.getBoundingClientRect().height}px`;
        children.style.opacity = '1';
        requestAnimationFrame(() => {
          children.style.height = '0px';
          children.style.opacity = '0';
        });
      }

      const finish = (event) => {
        if (event && (event.target !== children || event.propertyName !== 'height')) return;
        children.removeEventListener('transitionend', finish);
        children._treeTransitionCleanup = null;
        if (!shouldOpen) details.open = false;
        delete details.dataset.treeTargetOpen;
        children.classList.remove('is-tree-transitioning');
        children.style.height = '';
        children.style.opacity = '';
        children.style.overflow = '';
        requestAnimationFrame(syncRootLineWidthMobile);
      };
      children._treeTransitionCleanup = () => {
        children.removeEventListener('transitionend', finish);
        children._treeTransitionCleanup = null;
      };
      children.addEventListener('transitionend', finish);
    }

    function bindTreeTransitions() {
      treeEl.addEventListener('click', (event) => {
        const summary = event.target.closest('summary');
        if (!summary || !treeEl.contains(summary)) return;
        event.preventDefault();
        const details = summary.parentElement;
        animateDirectory(details, !details.open);
      });
    }

    function bindTreeResize() {
      treeEl.addEventListener('toggle', () => {
        requestAnimationFrame(syncRootLineWidthMobile);
      }, true);
      window.addEventListener('resize', syncRootLineWidthMobile);
    }

    function bindRootCollapse() {
      const rootLine = treeEl.querySelector('.tree-root-line');
      if (!rootLine) return;
      const toggleAll = (event) => {
        if (event.target.closest('a, button')) return;
        // Only target first-level directories (direct children of root tree)
        const firstLevelDetails = treeEl.querySelectorAll('ul.file-tree.root-tree > li > details');
        const anyOpen = Array.from(firstLevelDetails).some((d) => d.hasAttribute('open'));
        if (anyOpen) {
          // Collapse all first-level directories.
          firstLevelDetails.forEach((details) => {
            animateDirectory(details, false);
          });
        } else {
          // Expand all first-level directories (nested directories stay collapsed).
          firstLevelDetails.forEach((details) => {
            animateDirectory(details, true);
          });
        }
        requestAnimationFrame(syncRootLineWidthMobile);
      };
      rootLine.addEventListener('click', toggleAll);
      rootLine.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleAll(event);
        }
      });
    }

    async function init() {
      try {
        const response = await fetch('./manifest.json', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error(`manifest.json 请求失败：${response.status}`);
        }
        const manifest = await response.json();
        document.title = 'Crystal-Blogs';
        totalPostsEl.textContent = manifest.totalPosts ?? 0;
        totalCategoriesEl.textContent = manifest.totalCategories ?? 0;
        latestUpdatedEl.textContent = manifest.latestUpdatedAt || '—';
        generatedAtEl.textContent = manifest.generatedAt
          ? `Index generated at ${formatTimestamp(manifest.generatedAt)}`
          : 'Static directory index';

        const rootName = escapeHtml(manifest.rootName || 'notes');
        const rootCount = escapeHtml(`${manifest.totalPosts ?? 0} notes`);
        treeEl.innerHTML = `<div class="tree-root-line" role="button" tabindex="0" aria-label="${rootName} - 点击收起全部"><span class="tree-root-title tree-label">${rootName}</span><span class="tree-meta root-meta">${rootCount}</span></div>${renderNodes(Array.isArray(manifest.tree) ? manifest.tree : [])}`;
        bindTreeTransitions();
        bindTreeResize();
        bindRootCollapse();
      } catch (error) {
        treeEl.innerHTML = `<div class="tree-empty">无法读取目录索引：${escapeHtml(error.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
