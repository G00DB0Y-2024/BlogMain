<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Typora-style article viewer.">
  <title>Article Viewer</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./inkwell.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
</head>
<body class="viewer-page">
  <div class="viewer-shell">
    <div class="viewer-card">
      <div class="viewer-bar">
        <div class="viewer-bar-left">
          <a href="./index.html" class="viewer-back" title="返回主页">Home</a>
          <span class="viewer-title" id="viewer-title" role="button" tabindex="0" title="点击复制链接">Article</span>
          <span class="copy-feedback" id="copy-feedback" aria-live="polite"></span>
        </div>
        <div class="viewer-status" id="viewer-status">Loading…</div>
      </div>

      <div class="viewer-layout">
        <main class="viewer-content">
          <article id="write" aria-label="文章内容">
            <div class="viewer-error">正在加载文章…</div>
          </article>
        </main>

        <aside class="toc-panel panel" id="toc-panel" aria-label="文章目录">
          <div class="toc-header">
            <h2 class="section-title">TOC</h2>
          </div>
          <nav class="toc-list" id="toc-list"></nav>
        </aside>
      </div>
    </div>

    <div class="toc-drawer" id="toc-drawer" aria-hidden="true">
      <div class="toc-drawer-backdrop" id="toc-drawer-backdrop"></div>
      <aside class="toc-drawer-panel" aria-label="文章目录">
        <div class="toc-header">
          <h2 class="section-title">TOC</h2>
          <button type="button" class="toc-drawer-close" id="toc-drawer-close" aria-label="关闭目录">×</button>
        </div>
        <nav class="toc-list" id="toc-drawer-list"></nav>
      </aside>
    </div>
  </div>

  <script type="module">
    import {
      basename,
      escapeHtml,
      isAnchoredOrExternal,
      resolveAssetUrl,
      resolveFromSite,
      resolveMarkdownLink,
      safeDecodeURIComponent,
      stripLeadingSlashes,
      removeExtension,
    } from './scripts/shared.js';

    const writeEl = document.querySelector('#write');
    const statusEl = document.querySelector('#viewer-status');
    const titleEl = document.querySelector('#viewer-title');
    const tocPanelEl = document.querySelector('#toc-panel');
    const tocListEl = document.querySelector('#toc-list');
    const drawerEl = document.querySelector('#toc-drawer');
    const drawerBackdropEl = document.querySelector('#toc-drawer-backdrop');
    const drawerListEl = document.querySelector('#toc-drawer-list');
    const drawerPanelEl = document.querySelector('.toc-drawer-panel');
    const drawerCloseBtn = document.querySelector('#toc-drawer-close');
    let drawerOpen = false;
    const markdownUrl = new URL(window.location.href).searchParams.get('file');
    const copyFeedbackEl = document.querySelector('#copy-feedback');

    function getMarkdownPath() {
      const decoded = safeDecodeURIComponent(markdownUrl || '');
      const normalized = stripLeadingSlashes(decoded.replace(/\\/g, '/'));
      return normalized.startsWith('notes/') ? normalized : `notes/${normalized}`;
    }

    function createMarkdownIt() {
      const markdownit = window.markdownit;
      if (!markdownit) {
        throw new Error('markdown-it 未加载');
      }
      return markdownit({
        html: true,
        linkify: true,
        breaks: true,
        typographer: true,
      });
    }

    function normalizeLatexContent(content) {
      return String(content)
        .replace(/_\s*\{\s*\\?((?:max|min|argmax|argmin|sup|inf))\s*\}/g, '_{\\text{$1}}')
        .replace(/_\s*\\((?:max|min|argmax|argmin|sup|inf)\b)/g, (_, symbol) => `_{\\text{${symbol.slice(1)}}}`)
        .replace(/_\s*((?:max|min|argmax|argmin|sup|inf)\b)/g, (_, symbol) => `_{\\text{${symbol}}}`);
    }

    function renderKatex(content, displayMode) {
      const katex = window.katex;
      if (!katex) {
        throw new Error('katex 未加载');
      }
      return katex.renderToString(normalizeLatexContent(content), {
        displayMode,
        throwOnError: false,
        strict: 'ignore',
        trust: false,
        output: 'htmlAndMathml',
      });
    }

    function protectCode(source) {
      const stash = [];
      const replaceWithToken = (match) => {
        const token = `@@CODE_${stash.length}@@`;
        stash.push(match);
        return token;
      };

      const text = String(source)
        .replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, replaceWithToken)
        .replace(/`[^`\n]+`/g, replaceWithToken);

      return {
        text,
        restore(value) {
          return String(value).replace(/@@CODE_(\d+)@@/g, (_, index) => stash[Number(index)] ?? '');
        },
      };
    }

    // 归一化写作格式造成的渲染异常:
    //   ** 文字 **  →  **文字**
    //   * 文字 *    →  *文字*
    // 代码块已由 protectCode 替换为 @@CODE_N@@ 令牌,不会进入本函数;
    // __ / _ 不处理,以免破坏 snake_case 标识符和文件名。
    function normalizeWritingFormat(text) {
      const trim = (s) => s.replace(/^\s+|\s+$/g, '');
      const stash = [];
      const masked = String(text).replace(/@@[A-Z_0-9]+@@/g, (m) => {
        stash.push(m);
        return `\u0001${stash.length - 1}`;
      });
      const restored = masked
        .replace(/(?<![\*])\*\*([^*\n]+?)\*\*(?![\*])/g, (_, inner) => `**${trim(inner)}**`)
        .replace(/(?<![\*])\*([^*\n]+?)\*(?![\*])/g, (_, inner) => `*${trim(inner)}*`);
      return restored.replace(/\u0001(\d+)/g, (_, i) => stash[Number(i)]);
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function extractMath(source) {
      const protectedCode = protectCode(source);
      let text = normalizeWritingFormat(protectedCode.text);
      text = markHtmlImages(text);
      const inlineMath = [];
      const blockMath = [];

      const makeInlineToken = (html) => {
        const token = `@@MATH_INLINE_${inlineMath.length}@@`;
        inlineMath.push(html);
        return token;
      };

      const makeBlockToken = (html) => {
        const token = `@@MATH_BLOCK_${blockMath.length}@@`;
        blockMath.push(html);
        return token;
      };

      const replaceDisplayMath = (pattern) => {
        text = text.replace(pattern, (_, prefix, content) => {
          // Keep the Markdown container prefix so lists and block quotes remain open.
          const containerPrefix = new RegExp(`^${escapeRegExp(prefix)}`, 'gm');
          const latex = content.replace(containerPrefix, '').trim();
          const html = `<div class="math-display">${renderKatex(latex, true)}</div>`;
          const token = makeBlockToken(html);
          return `${prefix}\n${prefix}${token}\n${prefix}`;
        });
      };

      // A display formula may be nested in a list or block quote. Replacing it
      // with root-level blank lines closes that container and turns following
      // indented text into a Markdown code block.
      replaceDisplayMath(/^((?:[ \t]*>[ \t]?)+[ \t]*|[ \t]+)\$\$\s*\r?\n([\s\S]*?)\r?\n\1\$\$\s*$/gm);
      replaceDisplayMath(/^((?:[ \t]*>[ \t]?)+[ \t]*|[ \t]+)\\\[\s*\r?\n([\s\S]*?)\r?\n\1\\\]\s*$/gm);

      text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, content) => {
        const html = `<div class="math-display">${renderKatex(content.trim(), true)}</div>`;
        return `\n\n${makeBlockToken(html)}\n\n`;
      });

      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, content) => {
        const html = `<div class="math-display">${renderKatex(content.trim(), true)}</div>`;
        return `\n\n${makeBlockToken(html)}\n\n`;
      });

      text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, content) => {
        return makeInlineToken(renderKatex(content.trim(), false));
      });

      text = text.replace(/(?<!\\)\$([^\n$]+?)\$/g, (_, content) => {
        return makeInlineToken(renderKatex(content.trim(), false));
      });

      return {
        text: protectedCode.restore(text),
        inlineMath,
        blockMath,
      };
    }

    function injectMath(html, inlineMath, blockMath) {
      let output = html;

      for (let index = 0; index < blockMath.length; index += 1) {
        const token = `@@MATH_BLOCK_${index}@@`;
        const replacement = blockMath[index];
        const tokenEscaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        output = output
          .replace(new RegExp(`<p>\\s*${tokenEscaped}\\s*<\\/p>`, 'g'), replacement)
          .replace(new RegExp(tokenEscaped, 'g'), replacement);
      }

      output = output.replace(/<p>\s*<div class="math-display">([\s\S]*?)<\/div>\s*<\/p>/g, '<div class="math-display">$1</div>');

      for (let index = 0; index < inlineMath.length; index += 1) {
        const token = `@@MATH_INLINE_${index}@@`;
        const replacement = inlineMath[index];
        const tokenEscaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        output = output.replace(new RegExp(tokenEscaped, 'g'), replacement);
      }

      return output;
    }

    function resolveLinkHref(markdownPath, href) {
      const original = String(href || '').trim();
      if (!original || isAnchoredOrExternal(original)) {
        return original;
      }
      const clean = original.split('#')[0].split('?')[0];
      return resolveMarkdownLink(markdownPath, clean);
    }

    function centerStandaloneHtmlImages(root) {
      root.querySelectorAll('p').forEach((parent) => {
        const significantNodes = Array.from(parent.childNodes).filter((node) => {
          return node.nodeType !== Node.TEXT_NODE || node.textContent.trim();
        });
        if (significantNodes.length === 1 && significantNodes[0].nodeName === 'IMG') {
          parent.classList.add('image-only');
        }
      });
    }

    // 第二道防线: DOM 层兜底。
    // 当源文中存在 **text ** 这类配对成功但内部有空白的情况,
    // 第一道防线已经把 ** 里的空白 trim 掉,
    // 这里作为极端 case 的最后补救:把 <em>/<strong> 首尾 text node 的空白也去掉。
    function trimEmphasisInDom(root) {
      root.querySelectorAll('em, strong').forEach((el) => {
        const first = el.firstChild;
        const last = el.lastChild;
        if (first && first.nodeType === Node.TEXT_NODE) {
          first.nodeValue = first.nodeValue.replace(/^\s+/, '');
        }
        if (last && last.nodeType === Node.TEXT_NODE) {
          last.nodeValue = last.nodeValue.replace(/\s+$/, '');
        }
      });
    }

    // 第三道防线: 检测仍未被 markdown-it 解析掉的裸强调标记,输出 console.warn 提示作者。
    function warnUnresolvedEmphasis(root) {
      root.querySelectorAll('p, li').forEach((el) => {
        if (el.closest('pre, code')) return;
        const matches = (el.textContent.match(/\*\*[^*\s][^*]*?\*\*|\*[^*\s][^*\s]*?\*|__[^\s][^_]*?__/g) || []);
        if (!matches.length) return;
        // 若本元素内部已有 <strong>/<em>,说明已被解析,跳过
        if (el.querySelector('strong, em')) return;
        // 仅提示,不影响渲染
        console.warn('[viewer] 可能存在未配对的强调标记:', el.textContent.slice(0, 120), matches);
      });
    }

    function markHtmlImages(source) {
      return String(source).replace(/<img\b([^>]*?)>/gi, (match, attributes) => {
        if (/\bdata-html-image\b/i.test(attributes)) return match;
        return `<img data-html-image${attributes}>`;
      });
    }

    function processMediaLinks(root, markdownPath) {
      const allElements = root.querySelectorAll('img[src], source[src], video[src], audio[src], a[href]');
      allElements.forEach((element) => {
        if (element.tagName === 'A') {
          const original = element.getAttribute('href') || '';
          if (!original || isAnchoredOrExternal(original)) return;
          if (original.toLowerCase().endsWith('.md')) {
            const targetPath = resolveLinkHref(markdownPath, original);
            element.setAttribute('href', `./viewer.html?file=${encodeURIComponent(targetPath)}`);
            element.setAttribute('target', '_blank');
            element.setAttribute('rel', 'noopener noreferrer');
          } else {
            element.setAttribute('href', resolveAssetUrl(markdownPath, original));
          }
        } else {
          const original = element.getAttribute('src') || '';
          if (!original || isAnchoredOrExternal(original)) return;
          element.setAttribute('src', resolveAssetUrl(markdownPath, original));
          if (element.tagName === 'IMG') {
            element.setAttribute('loading', 'lazy');
            element.setAttribute('decoding', 'async');
          }
        }
      });
    }

    function slugify(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/['’"“”]/g, '')
        .replace(/[^\w\u4e00-\u9fff\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function getTocHeadings(root) {
      const minLevel = 2;
      const maxLevel = 5;
      const allHeadings = Array.from(root.querySelectorAll('h1, h2, h3, h4, h5, h6'))
        .filter((heading) => {
          const level = Number(heading.tagName.slice(1));
          return level >= minLevel && level <= maxLevel;
        });

      // Number by contiguous TOC depth, even when Markdown skips heading levels.
      let previousTocLevel = minLevel - 1;
      return allHeadings.map((heading) => {
        const level = Number(heading.tagName.slice(1));
        const tocLevel = level > previousTocLevel + 1
          ? Math.min(previousTocLevel + 1, maxLevel)
          : level;
        previousTocLevel = tocLevel;
        return {
          heading,
          level,
          rank: tocLevel - minLevel,
        };
      });
    }

    // Cache TOC headings once — avoid re-querying DOM on every scroll
    let _cachedHeadings = null;
    let _cachedTocLinks = null;

    function buildToc(root) {
      const headings = getTocHeadings(root);
      _cachedHeadings = headings;
      const usedIds = new Map();
      const items = [];
      const counters = [];

      headings.forEach(({ heading, level, rank }) => {
        const text = heading.textContent.trim();
        if (!text) return;

        counters[rank] = (counters[rank] || 0) + 1;
        counters.length = rank + 1;
        const number = counters.join('.');

        let id = heading.id || slugify(text) || `heading-${items.length + 1}`;
        const count = usedIds.get(id) || 0;
        if (count > 0) {
          id = `${id}-${count + 1}`;
        }
        usedIds.set(id, count + 1);
        heading.id = id;

        items.push({ level, rank, number, text, id });
      });

      if (!items.length) {
        const emptyHtml = '<div class="toc-empty">当前文章没有标题</div>';
        tocListEl.innerHTML = emptyHtml;
        drawerListEl.innerHTML = emptyHtml;
        tocPanelEl.classList.add('is-empty');
        _cachedTocLinks = [];
        return;
      }

      tocPanelEl.classList.remove('is-empty');
      const listHtml = items.map((item) => {
        return `
          <a class="toc-link level-${item.level}" data-heading-id="${item.id}" href="#${encodeURIComponent(item.id)}" style="--toc-indent:${item.rank}">
            <span class="toc-number" aria-hidden="true">${item.number}</span>
            <span class="toc-text">${escapeHtml(item.text)}</span>
          </a>`;
      }).join('');
      tocListEl.innerHTML = listHtml;
      drawerListEl.innerHTML = listHtml;

      _cachedTocLinks = [
        ...Array.from(tocListEl.querySelectorAll('.toc-link')),
        ...Array.from(drawerListEl.querySelectorAll('.toc-link')),
      ];

      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([tocListEl, drawerListEl]).catch(() => {});
      }
    }

    function enhanceCodeBlocks(root) {
      root.querySelectorAll('pre > code').forEach((code) => {
        const pre = code.parentElement;
        if (!pre || pre.dataset.enhanced === 'true') return;
        pre.dataset.enhanced = 'true';

        const wrapper = document.createElement('div');
        wrapper.className = 'code-frame';
        const header = document.createElement('div');
        header.className = 'code-frame-header';
        header.innerHTML = '<span>code</span><span>markdown</span>';

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });
    }

    function enhanceTables(root) {
      root.querySelectorAll('table').forEach((table) => {
        if (table.parentElement?.classList.contains('table-scroll')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-scroll';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    const tocMotion = {
      initialOffset: 104,
      thresholdOffset: 24,
      currentY: 104,
      targetY: 104,
      raf: 0,
    };

    let tocRaf = 0;
    let activeTocId = null;
    let tocSyncMode = 'scroll';
    let tocSyncModeTimer = 0;

    function getViewerPageTop() {
      const page = document.querySelector('.viewer-page');
      return page ? page.getBoundingClientRect().top : 0;
    }

    function computeTocTargetY() {
      const naturalY = getViewerPageTop() + tocMotion.initialOffset;
      return Math.max(tocMotion.thresholdOffset, naturalY);
    }

    function animateTocPosition() {
      tocMotion.targetY = computeTocTargetY();
      tocMotion.currentY += (tocMotion.targetY - tocMotion.currentY) * 0.16;

      if (Math.abs(tocMotion.targetY - tocMotion.currentY) < 0.2) {
        tocMotion.currentY = tocMotion.targetY;
      }

      tocPanelEl.style.setProperty('--toc-y', `${tocMotion.currentY}px`);

      if (tocMotion.currentY !== tocMotion.targetY) {
        tocMotion.raf = window.requestAnimationFrame(animateTocPosition);
        return;
      }

      tocMotion.raf = 0;
    }

    function scheduleTocMotion() {
      tocMotion.targetY = computeTocTargetY();
      if (!tocMotion.raf) {
        tocMotion.raf = window.requestAnimationFrame(animateTocPosition);
      }
    }

    function isPageAtBottom() {
      return window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
    }

    function forceTocTopAtPageStart() {
      if (window.scrollY <= 2) {
        if (tocPanelEl.scrollTop !== 0) tocPanelEl.scrollTop = 0;
        if (drawerListEl && drawerListEl.scrollTop !== 0) drawerListEl.scrollTop = 0;
      }
    }

    function forceTocBottomAtPageEnd() {
      if (!isPageAtBottom()) return;
      const maxDesktop = Math.max(0, tocPanelEl.scrollHeight - tocPanelEl.clientHeight);
      if (Math.abs(tocPanelEl.scrollTop - maxDesktop) > 1) {
        tocPanelEl.scrollTop = maxDesktop;
      }
      if (drawerListEl) {
        const maxDrawer = Math.max(0, drawerListEl.scrollHeight - drawerListEl.clientHeight);
        if (Math.abs(drawerListEl.scrollTop - maxDrawer) > 1) {
          drawerListEl.scrollTop = maxDrawer;
        }
      }
    }

    function scrollActiveTocIntoView(activeLink) {
      if (!activeLink) return;
      const panelRect = tocPanelEl.getBoundingClientRect();
      const linkRect = activeLink.getBoundingClientRect();
      const currentScroll = tocPanelEl.scrollTop;
      const relativeTop = linkRect.top - panelRect.top + currentScroll;
      const maxScroll = Math.max(0, tocPanelEl.scrollHeight - tocPanelEl.clientHeight);
      const targetViewportOffset = (panelRect.height - linkRect.height) / 2 - 8;
      const desired = Math.max(0, relativeTop - targetViewportOffset);
      const clamped = Math.min(desired, maxScroll);
      tocPanelEl.scrollTo({ top: clamped, behavior: 'smooth' });
    }

    function updateActiveToc() {
      if (!_cachedHeadings || !_cachedTocLinks) return;

      // 边界条件：页面最顶端/最底端时，TOC 也分别回到最顶端/最底端
      forceTocTopAtPageStart();
      forceTocBottomAtPageEnd();

      const visibleHeadings = _cachedHeadings.filter(({ heading }) => {
        const rect = heading.getBoundingClientRect();
        return rect.top < window.innerHeight && rect.bottom > 0;
      });

      if (!visibleHeadings.length) {
        return;
      }

      const activeId = visibleHeadings[0].heading.id;
      if (activeId === activeTocId) {
        return;
      }
      activeTocId = activeId;

      let activeDesktopLink = null;
      let activeDrawerLink = null;
      _cachedTocLinks.forEach((link) => {
        const isActive = link.dataset.headingId === activeId;
        link.classList.toggle('is-active', isActive);
        if (isActive) {
          if (tocListEl.contains(link)) {
            activeDesktopLink = link;
          } else if (drawerListEl.contains(link)) {
            activeDrawerLink = link;
          }
        }
      });

      const atTop = window.scrollY <= 2;
      const atBottom = isPageAtBottom();
      // 在边界位置已经处理过 TOC 滚动了，不再做跟随滚动
      if (!atTop && !atBottom && tocSyncMode === 'scroll') {
        if (activeDesktopLink) scrollActiveTocIntoView(activeDesktopLink);
        if (activeDrawerLink) scrollActiveTocIntoDrawerView(activeDrawerLink);
      }
    }

    function scheduleActiveTocUpdate() {
      if (tocRaf) return;
      tocRaf = window.requestAnimationFrame(() => {
        tocRaf = 0;
        updateActiveToc();
      });
    }

    function finalizeViewer(markdownPath) {
      _cachedHeadings = null;
      _cachedTocLinks = null;
      processMediaLinks(writeEl, markdownPath);
      centerStandaloneHtmlImages(writeEl);
      enhanceCodeBlocks(writeEl);
      enhanceTables(writeEl);
      trimEmphasisInDom(writeEl);
      warnUnresolvedEmphasis(writeEl);
      buildToc(writeEl);
      activeTocId = null;

      const firstHeading = writeEl.querySelector('h1, h2, h3');
      if (firstHeading) {
        titleEl.textContent = firstHeading.textContent.trim();
        document.title = `${firstHeading.textContent.trim()} · Typora Notes`;
      }

      requestAnimationFrame(() => {
        const active = new URL(window.location.href).hash.replace(/^#/, '');
        if (active) {
          const target = document.getElementById(active);
          if (target) {
            scrollToHeading(target);
          }
        }
        scheduleActiveTocUpdate();
        scheduleTocMotion();
      });
    }

    async function loadMarkdown(markdownPath) {
      if (!markdownPath) {
        throw new Error('缺少 file 参数');
      }

      const response = await fetch(resolveFromSite(markdownPath), { cache: 'no-cache' });
      if (!response.ok) {
        throw new Error(`无法加载文章：${response.status}`);
      }
      return response.text();
    }

    async function render() {
      try {
        const markdownPath = getMarkdownPath();
        const title = removeExtension(basename(markdownPath)) || 'Untitled';
        document.title = `${title} · Typora Notes`;
        titleEl.textContent = title;
        statusEl.textContent = markdownPath;

        const source = await loadMarkdown(markdownPath);
        const { text, inlineMath, blockMath } = extractMath(source);
        const md = createMarkdownIt();
        const html = injectMath(md.render(text, { markdownPath }), inlineMath, blockMath);

        writeEl.innerHTML = html;
        finalizeViewer(markdownPath);
        statusEl.textContent = 'Ready';
      } catch (error) {
        writeEl.innerHTML = `<div class="viewer-error">${escapeHtml(error.message)}</div>`;
        tocListEl.innerHTML = '<div class="toc-empty">目录不可用</div>';
        statusEl.textContent = 'Failed';
      }
    }

    window.addEventListener('scroll', () => {
      scheduleActiveTocUpdate();
      scheduleTocMotion();
    }, { passive: true });

    window.addEventListener('resize', scheduleTocMotion);
    window.addEventListener('scroll', forceTocTopAtPageStart, { passive: true });

    function scrollToHeading(target) {
      const pageOffset = 24;
      const targetTop = target.getBoundingClientRect().top + window.scrollY - pageOffset;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
    }

    tocListEl.addEventListener('click', (event) => {
      const link = event.target.closest('.toc-link');
      if (!link || !tocListEl.contains(link)) return;
      const targetId = link.dataset.headingId;
      const target = targetId ? document.getElementById(targetId) : null;
      if (!target) return;
      event.preventDefault();
      event.stopPropagation();
      window.history.pushState(null, '', `#${encodeURIComponent(targetId)}`);
      tocSyncMode = 'click';
      window.clearTimeout(tocSyncModeTimer);
      scrollToHeading(target);
      scrollActiveTocIntoView(link);
      tocSyncModeTimer = window.setTimeout(() => {
        tocSyncMode = 'scroll';
        scheduleActiveTocUpdate();
      }, 900);
    });

    function scrollActiveTocIntoDrawerView(activeLink) {
      if (!activeLink || !drawerListEl) return;
      const panelRect = drawerListEl.getBoundingClientRect();
      const linkRect = activeLink.getBoundingClientRect();
      const currentScroll = drawerListEl.scrollTop;
      const relativeTop = linkRect.top - panelRect.top + currentScroll;
      const maxScroll = Math.max(0, drawerListEl.scrollHeight - drawerListEl.clientHeight);
      const targetViewportOffset = (panelRect.height - linkRect.height) / 2 - 8;
      const desired = Math.max(0, relativeTop - targetViewportOffset);
      const clamped = Math.min(desired, maxScroll);
      drawerListEl.scrollTo({ top: clamped, behavior: 'smooth' });
    }

    drawerListEl.addEventListener('click', (event) => {
      const link = event.target.closest('.toc-link');
      if (!link || !drawerListEl.contains(link)) return;
      const targetId = link.dataset.headingId;
      const target = targetId ? document.getElementById(targetId) : null;
      if (!target) return;
      event.preventDefault();
      event.stopPropagation();
      window.history.pushState(null, '', `#${encodeURIComponent(targetId)}`);
      tocSyncMode = 'click';
      window.clearTimeout(tocSyncModeTimer);
      scrollToHeading(target);
      scrollActiveTocIntoDrawerView(link);
      tocSyncModeTimer = window.setTimeout(() => {
        tocSyncMode = 'scroll';
        scheduleActiveTocUpdate();
      }, 900);
      closeDrawer();
    });

    let copyFeedbackTimer = 0;

    async function copyViewerLink() {
      const currentUrl = window.location.href;
      try {
        await navigator.clipboard.writeText(currentUrl);
      } catch {
        window.prompt('复制这个链接', currentUrl);
        return;
      }

      window.clearTimeout(copyFeedbackTimer);
      copyFeedbackEl.textContent = '已复制链接';
      copyFeedbackEl.classList.add('is-visible');
      copyFeedbackTimer = window.setTimeout(() => {
        copyFeedbackEl.classList.remove('is-visible');
      }, 1800);
    }

    titleEl.addEventListener('click', copyViewerLink);
    titleEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        copyViewerLink();
      }
    });

    function openDrawer() {
      if (drawerOpen) return;
      drawerOpen = true;
      drawerEl.classList.add('is-open');
      drawerEl.setAttribute('aria-hidden', 'false');
      scheduleActiveTocUpdate();
    }

    function closeDrawer() {
      if (!drawerOpen) return;
      drawerOpen = false;
      drawerEl.classList.remove('is-open');
      drawerEl.setAttribute('aria-hidden', 'true');
    }

    if (drawerBackdropEl) {
      drawerBackdropEl.addEventListener('click', closeDrawer);
    }
    if (drawerCloseBtn) {
      drawerCloseBtn.addEventListener('click', closeDrawer);
    }
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && drawerOpen) {
        event.preventDefault();
        closeDrawer();
      }
    });

    const SWIPE_EDGE_PX = 24;
    const SWIPE_DISTANCE_PX = 56;
    let touchOrigin = null;

    window.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1) return;
      const t = event.touches[0];
      touchOrigin = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    window.addEventListener('touchmove', (event) => {
      if (!touchOrigin || event.touches.length !== 1) return;
      const t = event.touches[0];
      const dx = t.clientX - touchOrigin.x;
      const dy = t.clientY - touchOrigin.y;
      if (drawerOpen) {
        const panelWidth = drawerPanelEl ? drawerPanelEl.offsetWidth : 0;
        if (touchOrigin.x > panelWidth && Math.abs(dx) > Math.abs(dy) * 1.5) {
          if (typeof event.cancelable === 'boolean' && !event.cancelable) return;
          event.preventDefault();
        }
      } else if (dx > 12 && dx > Math.abs(dy) * 1.5) {
        // 抽屉关闭时，检测到明确的右滑意图就阻止默认行为（防止浏览器页面返回手势等）
        if (typeof event.cancelable === 'boolean' && !event.cancelable) return;
        event.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (event) => {
      if (!touchOrigin) {
        touchOrigin = null;
        return;
      }
      const t = event.changedTouches[0];
      if (!t) {
        touchOrigin = null;
        return;
      }
      const dx = t.clientX - touchOrigin.x;
      const dy = t.clientY - touchOrigin.y;

      if (!drawerOpen) {
        // 关闭抽屉时，屏幕任意位置右滑都可以打开 TOC
        if (dx > SWIPE_DISTANCE_PX && dx > Math.abs(dy) * 1.5) {
          openDrawer();
        }
      } else {
        const panelWidth = drawerPanelEl ? drawerPanelEl.offsetWidth : 0;
        if (touchOrigin.x > panelWidth && dx < -SWIPE_DISTANCE_PX && Math.abs(dx) > Math.abs(dy) * 1.5) {
          closeDrawer();
        }
      }
      touchOrigin = null;
    }, { passive: true });

    window.addEventListener('touchcancel', () => {
      touchOrigin = null;
    }, { passive: true });

    render();
  </script>
</body>
</html>
